# Render Blueprint — deploys the Flask honeypot backend and the React dashboard
# as two services. Point Render at this repo and pick "New > Blueprint".
services:
  - type: web
    name: honeypot-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && bash scripts/fetch_geoip.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      # Proxies between the internet and this app. Verify after deploying with
      # GET /api/debug/client-ip -- resolved_ip must match your public address.
      - key: PROXY_HOPS
        value: "1"
      # Optional: free MaxMind key enables real geolocation instead of
      # simulated locations. https://www.maxmind.com/en/geolite2/signup
      - key: MAXMIND_LICENSE_KEY
        sync: false
      # Leave DATABASE_URL unset to use the bundled SQLite file, or attach a
      # Postgres instance and paste its Internal Database URL here.
      - key: DATABASE_URL
        sync: false

  - type: web
    name: honeypot-dashboard
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Must match the backend service's public URL once it is created.
      - key: BACKEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
